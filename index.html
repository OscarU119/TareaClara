<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c6b"><meta name="description" content="Organiza tareas y consúltalas en móvil o computadora, incluso sin conexión."><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><title>Tarea Clara — Organizador multiplataforma</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172a40;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#123c6b;color:white;padding:20px clamp(20px,5vw,72px);display:flex;justify-content:space-between;align-items:center;gap:16px}header strong{font-size:1.25rem}header span{font-size:.88rem;color:#c9dced}main{max-width:1020px;margin:42px auto;padding:0 20px}.top{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:28px}.top h1{font-size:clamp(1.75rem,4vw,2.5rem);margin:0 0 6px}.top p{margin:0;color:#526477}.badge{background:#e1ecf7;color:#123c6b;padding:8px 13px;border-radius:100px;white-space:nowrap;font-weight:650}.layout{display:grid;grid-template-columns:minmax(250px,340px) 1fr;gap:22px}.card{background:#fff;border:1px solid #dce5ed;border-radius:16px;box-shadow:0 8px 30px #123c6b0a;padding:24px}h2{font-size:1.16rem;margin:0 0 18px}label{display:block;font-weight:650;font-size:.9rem;margin:16px 0 8px}input,select{width:100%;min-height:46px;border:1px solid #b8c8d7;border-radius:9px;padding:10px 12px;background:white;color:#172a40}input:focus,select:focus,button:focus-visible{outline:3px solid #70b7ee;outline-offset:2px}.primary{width:100%;border:0;border-radius:9px;background:#1662a4;color:white;padding:13px 16px;font-weight:700;margin-top:22px}.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filter button{border:1px solid #c6d4e1;border-radius:8px;background:white;color:#30465c;padding:8px 12px}.filter button.active{background:#123c6b;color:white;border-color:#123c6b}.list{list-style:none;margin:0;padding:0}.task{border-top:1px solid #e4eaf0;padding:17px 0;display:flex;gap:13px;align-items:start}.task:first-child{border-top:0}.task input{width:19px;min-height:19px;margin:3px 0;accent-color:#1662a4}.task .info{flex:1;min-width:0}.task strong{display:block;overflow-wrap:anywhere}.task.done strong{text-decoration:line-through;color:#758394}.meta{display:block;color:#637589;font-size:.86rem;margin-top:5px}.delete{border:0;background:transparent;color:#a03c44;padding:4px 6px;font-size:.86rem}.empty{padding:52px 12px;text-align:center;color:#647589;border:1px dashed #c9d6e2;border-radius:10px}.foot{margin:22px 0;color:#65778a;font-size:.85rem;text-align:center}@media(max-width:700px){header{padding:17px 20px}header span{display:none}main{margin:26px auto}.top{align-items:start;flex-direction:column}.layout{grid-template-columns:1fr}.card{padding:20px}}
</style></head><body><header><strong>✓ Tarea Clara</strong><span>Tu lista, en cualquier pantalla</span></header><main><div class="top"><div><h1>Organiza tus pendientes</h1><p>Agrega, completa y filtra tareas. Se guardan en este dispositivo.</p></div><span class="badge" id="count">0 pendientes</span></div><div class="layout"><section class="card"><h2>Nueva tarea</h2><form id="form"><label for="title">¿Qué necesitas hacer?</label><input id="title" maxlength="90" required placeholder="Ej. Terminar el reporte"><label for="category">Categoría</label><select id="category"><option>Estudio</option><option>Trabajo</option><option>Personal</option></select><label for="date">Fecha límite (opcional)</label><input id="date" type="date"><button class="primary">Agregar tarea</button></form></section><section class="card"><h2>Mis tareas</h2><nav class="filter" aria-label="Filtrar tareas"><button data-filter="all" class="active" aria-pressed="true">Todas</button><button data-filter="pending" aria-pressed="false">Pendientes</button><button data-filter="done" aria-pressed="false">Completadas</button></nav><ul class="list" id="list" aria-live="polite"></ul></section></div><p class="foot">Instalable en navegadores compatibles. Las tareas permanecen en el almacenamiento local de cada dispositivo.</p></main><script>
const KEY='tareaclara-tasks-v1';let tasks=[];let filter='all';try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))tasks=saved.filter(t=>t&&typeof t.title==='string')}catch{}const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(tasks));function render(){const pending=tasks.filter(t=>!t.done).length;$('count').textContent=`${pending} pendiente${pending===1?'':'s'}`;const shown=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));$('list').replaceChildren();if(!shown.length){const e=document.createElement('li');e.className='empty';e.textContent=filter==='all'?'Aún no hay tareas. Agrega la primera.':'No hay tareas en este filtro.';$('list').append(e)}shown.forEach(t=>{const li=document.createElement('li');li.className='task'+(t.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;cb.setAttribute('aria-label','Completar '+t.title);cb.onchange=()=>{t.done=cb.checked;save();render()};const info=document.createElement('div');info.className='info';const title=document.createElement('strong');title.textContent=t.title;const meta=document.createElement('span');meta.className='meta';meta.textContent=t.category+(t.date?' · Fecha límite: '+t.date:'');info.append(title,meta);const del=document.createElement('button');del.className='delete';del.textContent='Eliminar';del.setAttribute('aria-label','Eliminar '+t.title);del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()};li.append(cb,info,del);$('list').append(li)})} $('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;tasks.unshift({id:crypto.randomUUID(),title,category:$('category').value,date:$('date').value,done:false});save();$('form').reset();render();$('title').focus()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()});render();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
